<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 대시보드</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; }
    #login-box { margin-bottom: 20px; }
    #data-box { display: none; }
  </style>
</head>
<body>
  <h1>관리자 대시보드</h1>
  <div id="login-box">
    <p>관리자 비밀번호를 입력하세요:</p>
    <input type="password" id="password" placeholder="비밀번호">
    <button onclick="login()">로그인</button>
    <p id="status"></p>
  </div>

  <div id="data-box">
    <h2>📋 문의 데이터(JSON)</h2>
    <pre id="json-data">불러오는 중...</pre>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin123";  // 나중에 환경변수나 DB로 옮길 수 있음

    function login() {
      const input = document.getElementById("password").value;
      if (input === ADMIN_PASSWORD) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("data-box").style.display = "block";
        loadData();
      } else {
        document.getElementById("status").innerText = "❌ 비밀번호가 틀렸습니다.";
      }
    }

    async function loadData() {
      try {
        const response = await fetch("/api/support");
        const data = await response.json();
        document.getElementById("json-data").innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("json-data").innerText = "데이터를 불러올 수 없습니다.";
      }
    }
  </script>
</body>
</html>
